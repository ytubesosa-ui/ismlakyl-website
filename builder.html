
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISML AKYL | NBA 2K27 Build Lab</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: #10151e;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .builder-container {
            max-width: 1400px;
            margin: 60px auto;
            padding: 25px;
        }
        .builder-title {
            text-align: center;
            margin-bottom: 35px;
        }
        .builder-title h1 {
            font-size: 42px;
            font-weight: 800;
        }
        .builder-title span {
            color: #ef4444;
        }
        .builder-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .builder-panel {
            background: #192331;
            padding: 25px;
            border-radius: 12px;
        }
        .builder-panel h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }
        @media (max-width: 800px) {
            .builder-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="builder-container">
        <header class="builder-title">
            <h1>ISML AKYL <span>BUILD LAB</span></h1>
            <p>NBA 2K27 MyPLAYER Builder</p>
        </header>

       
<section class="builder-panel" style="margin-bottom:20px;">
    <h2>MYPLAYER SETTINGS</h2>

    <div style="display:flex;flex-wrap:wrap;gap:20px;">
        <label>Position
            <select id="position">
                <option>PG</option>
                <option>SG</option>
                <option>SF</option>
                <option>PF</option>
                <option>C</option>
            </select>
        </label>

        <label>Height
            <select id="height"></select>
        </label>

        <label>Weight (lbs)
            <select id="weight"></select>
        </label>

        <label>Wingspan
            <select id="wingspan"></select>
        </label>
    </div>
</section>

        <div class="builder-grid">
            <section class="builder-panel">
                <h2>PLAYER ATTRIBUTES</h2>
                <p>Finishing</p>
                <p>Shooting</p>
                <p>Playmaking</p>
                <p>Defense</p>
                <p>Physicals</p>
            </section>

            <section class="builder-panel">
                <h2>CAP BREAKER</h2>
                <p>Cap Breaker sistemi burada görünecek.</p>
                <hr>
                <h2>BADGES</h2>
                <p>Badge sistemi burada görünecek.</p>
            </section>
        </div>
    </main>

<script>
const heightSelect = document.getElementById("height");

function formatHeight(inches) {
    const feet = Math.floor(inches / 12);
    const remaining = inches % 12;
    return `${feet}'${remaining}"`;
}

// Tüm boy seçenekleri için başlangıç listesi
for (let inches = 69; inches <= 88; inches++) {
    const option = document.createElement("option");
    option.value = inches;
    option.textContent = formatHeight(inches);
    heightSelect.appendChild(option);
}

const wingspanSelect = document.getElementById("wingspan");

function updateWingspan() {
    const height = Number(heightSelect.value);

    wingspanSelect.innerHTML = "";

    // Geçici aralık: boydan 6 inç fazlasına kadar
    for (let inches = height; inches <= height + 6; inches++) {
        const option = document.createElement("option");
        option.value = inches;
        option.textContent = formatHeight(inches);
        wingspanSelect.appendChild(option);
    }
}

heightSelect.addEventListener("change", updateWingspan);
updateWingspan();


const weightSelect = document.getElementById("weight");

function updateWeight() {
    weightSelect.innerHTML = "";

    // Geçici değerler; gerçek NBA 2K27 sınırları
    // doğrulandıktan sonra güncellenecek.
    for (let lbs = 150; lbs <= 300; lbs++) {
        const option = document.createElement("option");
        option.value = lbs;
        option.textContent = `${lbs} lbs`;
        weightSelect.appendChild(option);
    }
}

heightSelect.addEventListener("change", updateWeight);
updateWeight();

</script>

</body>
</html>
