<body>

  <main class="container">
    <h1>🏆 YORUM LİDERLERİ</h1>
    <p class="subtitle">ISML AKYL YouTube topluluğu</p>

    <div class="tabs">
      <button id="monthly" class="active">📅 Bu Ay</button>
      <button id="alltime">🏆 Genel Sıralama</button>
    </div>

    <p id="status">Yorumlar yükleniyor...</p>
    <div id="leaderboard"></div>

    <p class="notice">
      Test sürümü: Şimdilik son 5 videodaki
      yorumlar hesaplanmaktadır.
    </p>
  </main>

  <script>
    let data = null;
    let selected = "monthlyLeaderboard";

    const list = document.getElementById("leaderboard");
    const status = document.getElementById("status");
    const monthly = document.getElementById("monthly");
    const alltime = document.getElementById("alltime");

    function render() {
      list.replaceChildren();

      const users = data?.[selected] || [];

      status.textContent = users.length
        ? ""
        : "Henüz bu sıralamada yorum bulunamadı.";

      users.forEach((user, index) => {
        const row = document.createElement("div");
        row.className = "person";

        const rank = document.createElement("span");
        rank.className = "rank";

rank.textContent = ["🥇", "🥈", "🥉"][index] || index + 1;

        const avatar = document.createElement("img");
        avatar.src = user.avatar || "";
        avatar.alt = "";

        const name = document.createElement("div");
        name.className = "name";

        const link = document.createElement("a");
        link.textContent = user.name || "YouTube kullanıcısı";
        if (user.channelId) {
          link.href = "https://www.youtube.com/channel/" +
            encodeURIComponent(user.channelId);
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
        name.appendChild(link);

        const count = document.createElement("span");
        count.className = "count";
        count.textContent = user.comments + " yorum";

        row.append(rank, avatar, name, count);
        list.appendChild(row);
      });
    }

    monthly.onclick = () => {
      selected = "monthlyLeaderboard";
      monthly.classList.add("active");
      alltime.classList.remove("active");
      if (data) render();
    };

    alltime.onclick = () => {
      selected = "leaderboard";
      alltime.classList.add("active");
      monthly.classList.remove("active");
      if (data) render();
    };

    fetch("/api/comments")
      .then(response => {
        if (!response.ok) throw new Error("API hatası");
        return response.json();
      })
      .then(result => {
        data = result;
        render();
      })
      .catch(() => {
        status.textContent = "Sıralama yüklenemedi.";
      });
  </script>
  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
